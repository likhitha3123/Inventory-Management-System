<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<link rel="stylesheet" href="/static/css/theme.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ── Analyst shared styles — extend theme.css ─────── */
.an-card {
  background:#fff; border-radius:var(--radius); padding:20px;
  box-shadow:var(--shadow-sm); border:1px solid var(--slate-100);
  min-width:0; /* prevent grid blowout on mobile */
}
.an-card h3 {
  font-family:'Outfit',sans-serif; font-size:13px; font-weight:700;
  color:var(--slate-800); margin:0 0 2px;
}
.an-card .sub {
  font-size:11px; color:var(--slate-400); margin:0 0 14px; line-height:1.5;
}
/* chart canvas max-height so donut never blows up */
.an-card canvas { max-height:240px; width:100% !important; }
.an-card canvas.tall { max-height:300px; }
.an-card canvas.short { max-height:180px; }

.ch-legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }

/* KPI strip */
.kpi-strip { display:grid; gap:12px; margin-bottom:20px;
  grid-template-columns: repeat(4, 1fr); }
@media(max-width:640px){ .kpi-strip{ grid-template-columns: repeat(2,1fr); } }
.kpi-box { background:#fff; border-radius:var(--radius); padding:14px 12px;
  box-shadow:var(--shadow-sm); border:1px solid var(--slate-100); text-align:center; }
.kpi-box .kv { font-family:'Outfit',sans-serif; font-size:18px; font-weight:700;
  color:var(--slate-800); line-height:1.2; word-break:break-all; }
.kpi-box .kl { font-size:10px; color:var(--slate-500); margin-top:3px;
  text-transform:uppercase; letter-spacing:.4px; }

/* chart grids */
.g2c { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
.g3c { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:16px; }
.g1c { display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:16px; }
@media(max-width:900px){ .g3c{ grid-template-columns:1fr 1fr; } }
@media(max-width:600px){ .g2c,.g3c{ grid-template-columns:1fr; } }

/* page banner */
.pg-banner { border-radius:14px; padding:16px 20px; margin-bottom:20px;
  display:flex; align-items:center; gap:14px; color:#fff; }
.pg-banner h2 { font-family:'Outfit',sans-serif; font-size:17px; font-weight:800; margin:0; }
.pg-banner p  { font-size:12px; opacity:.75; margin:4px 0 0; }

/* err */
.err-box { display:none; background:#fee2e2; border:1px solid #fca5a5; color:#991b1b;
  padding:10px 14px; border-radius:9px; margin-bottom:14px; font-size:12px; }

/* ── TABLE (view-only, extends theme table styles) ─── */
.tbl-card { background:#fff; border-radius:var(--radius); padding:20px;
  box-shadow:var(--shadow-sm); border:1px solid var(--slate-100); margin-bottom:16px; }
.tbl-card h3 { font-family:'Outfit',sans-serif; font-size:13px; font-weight:700;
  color:var(--slate-800); margin:0 0 14px; }
.tbl-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.tbl-toolbar input { flex:1; min-width:160px; max-width:260px; padding:7px 11px;
  border:1.5px solid var(--slate-200); border-radius:var(--radius-sm);
  font-family:'DM Sans',sans-serif; font-size:12px; outline:none; }
.tbl-toolbar input:focus { border-color:var(--sky-400); }
.tbl-count { font-size:11px; color:var(--slate-400); white-space:nowrap; }
/* no horizontal scroll on mobile — use wrap instead */
.tbl-outer { width:100%; overflow-x:auto; border-radius:9px;
  border:1px solid var(--slate-100); }
.tbl-outer table { min-width:480px; }
.tbl-pgn { display:flex; gap:5px; margin-top:12px; flex-wrap:wrap; }
.tbl-pgn button { width:30px; height:30px; border-radius:7px; border:1.5px solid var(--slate-200);
  background:#fff; cursor:pointer; font-size:12px; display:grid; place-items:center;
  color:var(--slate-600); transition:all .2s; }
.tbl-pgn button.active,.tbl-pgn button:hover { background:var(--sky-600); color:#fff; border-color:var(--sky-600); }

/* eye button in table */
.btn-eye { background:var(--sky-50); border:1.5px solid var(--sky-200); color:var(--sky-700);
  padding:4px 8px; border-radius:6px; cursor:pointer; font-size:13px;
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500;
  transition:all .15s; white-space:nowrap; }
.btn-eye:hover { background:var(--sky-100); border-color:var(--sky-400); }

/* view modal — wide enough for record details */
.view-modal { max-width:520px; }
.vm-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
@media(max-width:480px){ .vm-grid{ grid-template-columns:1fr; } }
.vm-row { padding:8px 0; border-bottom:1px solid var(--slate-100); }
.vm-row:last-child { border-bottom:none; }
.vm-label { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--slate-400); font-weight:600; margin-bottom:2px; }
.vm-value { font-size:13px; color:var(--slate-800); font-weight:500; word-break:break-word; }
</style>
</head>
