<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Password — INVENTORY</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}"/>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-box">📦</div>
    <span class="brand-name">INVENTORY</span>
  </div>

  <h2 class="auth-title">Set New Password 🔑</h2>
  <p class="auth-subtitle">This is your first login. Please set a new password to continue.</p>

  <div id="msgBox" class="alert alert-info" style="display:flex;">
    🔒 Choose a strong password with at least 8 characters.
  </div>

  <div id="errBox" class="alert alert-error" style="display:none;"></div>

  <form id="changeForm">
    <div class="form-group">
      <label class="form-label">New Password <span class="required-star">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" class="form-control" placeholder="Enter new password" required minlength="8"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password <span class="required-star">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="confirm" class="form-control" placeholder="Repeat new password" required minlength="8"/>
      </div>
    </div>

    <button type="submit" class="btn-auth">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Save Password</span>
    </button>
  </form>
</div>

<script>
const form   = document.getElementById('changeForm');
const errBox = document.getElementById('errBox');
const btn    = document.getElementById('btnText');
const spin   = document.getElementById('spinner');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    const pwd  = document.getElementById('password').value;
    const conf = document.getElementById('confirm').value;
    if (pwd !== conf) {
        errBox.textContent = 'Passwords do not match.';
        errBox.style.display = 'flex';
        return;
    }
    btn.textContent = 'Saving…'; spin.style.display = 'block';
    form.querySelector('.btn-auth').disabled = true;
    try {
        const res  = await fetch('/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();
        if (res.ok && data.redirect) {
            window.location.href = data.redirect;
        } else {
            errBox.textContent = data.message || 'Error saving password.';
            errBox.style.display = 'flex';
        }
    } catch {
        errBox.textContent = 'Network error.';
        errBox.style.display = 'flex';
    } finally {
        btn.textContent = 'Save Password'; spin.style.display = 'none';
        form.querySelector('.btn-auth').disabled = false;
    }
});
</script>
</body>
</html>
