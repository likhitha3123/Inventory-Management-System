<main class="main-content">
  <div class="page-header">
    <div><h1 class="page-title">Customers</h1><p class="page-subtitle" id="subtitle">Customers in your state.</p></div>
  </div>

  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
      <input type="text" id="search" class="form-control" placeholder="Search customer ID or email…" style="max-width:300px;" oninput="filterRows()"/>
    </div>
    <div class="table-wrap">
      <table id="custTable">
        <thead><tr><th>Customer ID</th><th>Email</th><th>Phone</th><th>Age</th><th>Income Bracket</th><th>Actions</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6" style="text-align:center;padding:30px;color:#94a3b8;">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script src="/static/js/base.js"></script>
<script>
var allCustomers = [];

async function load() {
  var d = await fetch('/manager/api/customers').then(r=>r.json());
  allCustomers = d.items || [];
  document.getElementById('subtitle').textContent = fmt(d.total) + ' customers in your state.';
  renderRows(allCustomers);
}

function filterRows() {
  var q = document.getElementById('search').value.toLowerCase();
  renderRows(q ? allCustomers.filter(c =>
    (c.customer_id||'').toLowerCase().includes(q) ||
    (c.email||'').toLowerCase().includes(q) ||
    (c.phone||'').toLowerCase().includes(q)
  ) : allCustomers);
}

var _custCache = [];
function renderRows(items) {
  _custCache = items;
  document.getElementById('tbody').innerHTML = items.length
    ? items.map((c, idx) => `<tr>
        <td>${badge(c.customer_id,'purple')}</td>
        <td>${c.email ? `<a href="mailto:${c.email}" style="color:#0284c7;">${c.email}</a>` : '—'}</td>
        <td style="font-size:12px;">${c.phone||'—'}</td>
        <td>${c.age||'—'}</td>
        <td>${c.income_bracket||'—'}</td>
        <td class="action-btns">
          <button class="btn btn-icon btn-icon-view" title="View Details" onclick="viewCustDetail(${idx})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </td>
      </tr>`).join('')
    : '<tr><td colspan="6" style="text-align:center;padding:30px;color:#94a3b8;">No customers found in your state.</td></tr>';
}

function viewCustDetail(idx) {
  var c = _custCache[idx];
  if (!c) return;
  showDetailModal('Customer Details', `
    <div class="detail-grid">
      <div class="dg-row"><span class="dg-label">Customer ID</span><span class="dg-val">${badge(c.customer_id,'purple')}</span></div>
      <div class="dg-row"><span class="dg-label">Email</span><span class="dg-val">${c.email ? `<a href="mailto:${c.email}" style="color:#0284c7;">${c.email}</a>` : '—'}</span></div>
      <div class="dg-row"><span class="dg-label">Phone</span><span class="dg-val">${c.phone||'—'}</span></div>
      <div class="dg-row"><span class="dg-label">Age</span><span class="dg-val">${c.age||'—'}</span></div>
      <div class="dg-row"><span class="dg-label">Gender</span><span class="dg-val">${c.gender||'—'}</span></div>
      <div class="dg-row"><span class="dg-label">Income Bracket</span><span class="dg-val">${c.income_bracket||'—'}</span></div>
      <div class="dg-row"><span class="dg-label">Purchase Frequency</span><span class="dg-val">${c.purchase_frequency||'—'}</span></div>
      <div class="dg-row"><span class="dg-label">Avg Spend</span><span class="dg-val">${c.average_spend ? '₹'+fmt(c.average_spend,2) : '—'}</span></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline" onclick="closeDetailModal()">Close</button>
    </div>
  `);
}

window.onload = load;
</script>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
</body>
